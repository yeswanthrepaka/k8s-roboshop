apiVersion: v1
kind: ConfigMap

metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop
    component: catalogue
    tier: backend

data:
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/catalogue"

---
apiVersion: apps/v1
kind: Deployment

metadata: 
  name: catalogue
  namespace: roboshop
  labels: 
    project: roboshop
    component: catalogue
    tier: backend

spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: catalogue
      tier: backend

  template:
    metadata:
      labels:
        project: roboshop
        component: catalogue
        tier: backend
    spec:
      containers:
      - name: catalogue
        image: yeswanthrepaka/catalogue:1.3.0
        readinessProbe:
          tcpSocket:
            port: 8080
          failureThreshold: 2
          periodSeconds: 10
          initialDelaySeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          failureThreshold: 2
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: catalogue

---
apiVersion: v1
kind: Service

metadata:
  name: catalogue
  namespace: roboshop
  labels:
      project: roboshop
      component: catalogue
      tier: backend

spec:
  selector:
    project: roboshop
    component: catalogue
    tier: backend
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017
